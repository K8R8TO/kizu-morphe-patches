name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid generatePatchesList

      - name: Verify release artifact
        run: |
          test -f patches/build/libs/patches-1.7.1.mpp
          ls -lh patches/build/libs/patches-1.7.1.mpp

      - name: Create maintenance release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.1
          name: v1.7.1
          target_commitish: ${{ github.sha }}
          body: |
            Kizu release 1.7.1.

            Fixes third-party emote picker placement/re-entry and uses Twitch's native Channel Points claim path without modifying the points balance.
          files: patches/build/libs/patches-1.7.1.mpp
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.7.1 --json tagName,assets --jq '.tagName + " " + ([.assets[].name] | join(","))'
