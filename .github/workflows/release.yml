name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[release-mirror]') }}
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Read release version
        id: version
        run: |
          VERSION="$(awk -F '=' '$1 ~ /^[[:space:]]*version[[:space:]]*$/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' gradle.properties)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate Morphe metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          v = os.environ["VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:\.\d+)?", v): raise SystemExit(f"Invalid version: {v}")
          bundle = json.loads(pathlib.Path("patches-bundle.json").read_text())
          plist = json.loads(pathlib.Path("patches-list.json").read_text())
          if bundle.get("version") != v or plist.get("version") != v:
              raise SystemExit(f"Version mismatch: gradle={v}, bundle={bundle.get('version')}, list={plist.get('version')}")
          expected_release = f"https://github.com/K8R8TO/kizu-morphe-patches/releases/download/v{v}/patches-{v}.mpp"
          expected_mirror = f"https://raw.githubusercontent.com/K8R8TO/kizu-morphe-patches/main/mirror/patches-{v}.mpp"
          expected_cdn = f"https://cdn.jsdelivr.net/gh/K8R8TO/kizu-morphe-patches@main/mirror/patches-{v}.mpp"
          if bundle.get("download_url") not in (expected_release, expected_mirror, expected_cdn):
              raise SystemExit("patches-bundle.json download_url does not match a supported release URL")
          PY

      - name: Pin local release tag for metadata generation
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -f "v${VERSION}" "${GITHUB_SHA}"

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid

      - name: Verify release bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUNDLE="patches/build/release/patches-${VERSION}.mpp"
          test -f "${BUNDLE}"
          unzip -t "${BUNDLE}" >/dev/null
          echo "Verified finished Morphe bundle: ${BUNDLE}"
          unzip -l "${BUNDLE}" | grep -E '(^|/)classes\.dex$|META-INF/MANIFEST\.MF' || true

      - name: Verify release metadata after build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          v = os.environ["VERSION"]
          bundle = json.loads(pathlib.Path("patches-bundle.json").read_text())
          plist = json.loads(pathlib.Path("patches-list.json").read_text())
          assert bundle.get("version") == v, f"bundle version changed during build: {bundle.get('version')}"
          assert plist.get("version") == v, f"patch list version changed during build: {plist.get('version')}"
          expected_release = f"https://github.com/K8R8TO/kizu-morphe-patches/releases/download/v{v}/patches-{v}.mpp"
          expected_mirror = f"https://raw.githubusercontent.com/K8R8TO/kizu-morphe-patches/main/mirror/patches-{v}.mpp"
          expected_cdn = f"https://cdn.jsdelivr.net/gh/K8R8TO/kizu-morphe-patches@main/mirror/patches-{v}.mpp"
          assert bundle.get("download_url") in (expected_release, expected_mirror, expected_cdn), "bundle download URL changed unexpectedly during build"
          PY

      - name: Verify embedded MPP manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUNDLE="patches/build/release/patches-${VERSION}.mpp"
          unzip -p "${BUNDLE}" META-INF/MANIFEST.MF | tee /tmp/kizu-mpp-manifest.txt
          grep -Fq "Name: Kizu Twitch Patches" /tmp/kizu-mpp-manifest.txt
          grep -Fq "Version: ${VERSION}" /tmp/kizu-mpp-manifest.txt
          grep -Fq "Author: Kizu" /tmp/kizu-mpp-manifest.txt
          grep -Fq "Source: https://github.com/K8R8TO/kizu-morphe-patches.git" /tmp/kizu-mpp-manifest.txt
          grep -Fq "Website: https://github.com/K8R8TO/kizu-morphe-patches" /tmp/kizu-mpp-manifest.txt
          grep -Fq "License: GPLv3" /tmp/kizu-mpp-manifest.txt
          grep -Fq "Patcher-Version:" /tmp/kizu-mpp-manifest.txt
      - name: Verify release artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUNDLE="patches/build/release/patches-${VERSION}.mpp"
          test -f "${BUNDLE}"
          test "$(stat -c '%s' "${BUNDLE}")" -gt 0

      - name: Check release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: Kizu release ${{ steps.version.outputs.version }}.
          files: patches/build/release/patches-${{ steps.version.outputs.version }}.mpp
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "v${VERSION}" --json tagName,assets --jq '.tagName + " " + ([.assets[].name] | join(","))' | grep -F "v${VERSION} patches-${VERSION}.mpp"
      - name: Publish stable raw MPP mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="patches/build/release/patches-${VERSION}.mpp"
          MIRROR="mirror/patches-${VERSION}.mpp"
          RAW_URL="https://raw.githubusercontent.com/K8R8TO/kizu-morphe-patches/main/${MIRROR}"
          CDN_URL="https://cdn.jsdelivr.net/gh/K8R8TO/kizu-morphe-patches@main/${MIRROR}"
          mkdir -p mirror
          cp "${BUNDLE}" "${MIRROR}"

          PUBLISHED_AT="$(gh release view "v${VERSION}" --json publishedAt --jq '.publishedAt')"
          export PUBLISHED_AT
          python3 - <<'PY'
          import json, os, pathlib
          version = os.environ["VERSION"]
          published_at = os.environ["PUBLISHED_AT"]
          path = pathlib.Path("patches-bundle.json")
          data = json.loads(path.read_text())
          data["version"] = version
          data["created_at"] = published_at
          data["download_url"] = f"https://cdn.jsdelivr.net/gh/K8R8TO/kizu-morphe-patches@main/mirror/patches-{version}.mpp"
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "mirror/patches-${VERSION}.mpp" patches-bundle.json
          git commit -m "ci: mirror v${VERSION} MPP [release-mirror]"
          git push origin HEAD:main

          EXPECTED_SHA="$(sha256sum "${BUNDLE}" | cut -d' ' -f1)"
          for attempt in $(seq 1 30); do
            if curl -fsSL --retry 2 --retry-delay 1 "${RAW_URL}" -o /tmp/kizu-mirror.mpp; then
              ACTUAL_SHA="$(sha256sum /tmp/kizu-mirror.mpp | cut -d' ' -f1)"
              if [ "${ACTUAL_SHA}" = "${EXPECTED_SHA}" ] && unzip -t /tmp/kizu-mirror.mpp >/dev/null; then
                echo "Verified raw MPP mirror: ${RAW_URL}"
                break
              fi
            fi
            sleep 2
          done

          for attempt in $(seq 1 30); do
            if curl -fsSL --retry 2 --retry-delay 1 "${CDN_URL}" -o /tmp/kizu-cdn.mpp; then
              ACTUAL_SHA="$(sha256sum /tmp/kizu-cdn.mpp | cut -d' ' -f1)"
              if [ "${ACTUAL_SHA}" = "${EXPECTED_SHA}" ] && unzip -t /tmp/kizu-cdn.mpp >/dev/null; then
                echo "Verified jsDelivr MPP mirror: ${CDN_URL}"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Raw MPP mirror did not become readable with the expected SHA-256: ${RAW_URL}"
          EXPECTED_SHA="$(sha256sum "${BUNDLE}" | cut -d' ' -f1)"
          RAW_OK=false
          for attempt in $(seq 1 30); do
            if curl -fsSL --retry 2 --retry-delay 1 "${RAW_URL}" -o /tmp/kizu-raw.mpp; then
              ACTUAL_SHA="$(sha256sum /tmp/kizu-raw.mpp | cut -d' ' -f1)"
              if [ "${ACTUAL_SHA}" = "${EXPECTED_SHA}" ] && unzip -t /tmp/kizu-raw.mpp >/dev/null; then
                echo "Verified raw MPP mirror: ${RAW_URL}"
                RAW_OK=true
                break
              fi
            fi
            sleep 2
          done
          test "${RAW_OK}" = true

          for attempt in $(seq 1 30); do
            if curl -fsSL --retry 2 --retry-delay 1 "${CDN_URL}" -o /tmp/kizu-cdn.mpp; then
              ACTUAL_SHA="$(sha256sum /tmp/kizu-cdn.mpp | cut -d' ' -f1)"
              if [ "${ACTUAL_SHA}" = "${EXPECTED_SHA}" ] && unzip -t /tmp/kizu-cdn.mpp >/dev/null; then
                echo "Verified jsDelivr MPP mirror: ${CDN_URL}"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "jsDelivr MPP mirror did not become readable with the expected SHA-256: ${CDN_URL}"

