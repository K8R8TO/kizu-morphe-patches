name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build patch bundle and metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gradle :patches:buildAndroid :patches:generatePatchesList
          test -s patches-list.json
          jq -e '.patches | length == 1' patches-list.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install release tooling
        run: npm install

      - name: Release
        id: release
        uses: cycjimmy/semantic-release-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published metadata
        if: steps.release.outputs.new_release_published == 'true'
        run: |
          jq -e '.patches | length == 1' patches-list.json
          test -f "patches/build/libs/patches-${{ steps.release.outputs.new_release_version }}.mpp"

      - name: Attest release artifact
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: "Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}"
          subject-path: "patches/build/libs/patches-*.mpp"
