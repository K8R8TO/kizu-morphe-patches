name: Verify

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: burrunan/gradle-cache-action@v3
      - run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid generatePatchesList clean
